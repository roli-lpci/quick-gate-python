name: "Example: PyGate Quality Gates"

# Copy this workflow into your repository as .github/workflows/pygate.yml

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for changed file detection

      # The root action owns gate execution, but this repository owns its
      # project and development dependencies.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - uses: hermes-labs-ai/quick-gate-python@aef81b5e832f98aaef02b0a1f64f8eed277e92f1
        with:
          mode: canary          # or "full" to include caller-installed tests
          python-version: "3.12"
          fail-on-error: "true"
